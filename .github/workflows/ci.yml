name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}

      - name: Check OpenTofu and policy files
        run: nix develop --accept-flake-config -c scripts/check

      - name: Check GitHub organization members
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_ORG_MEMBERS_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::GitHub member check skipped: GH_ORG_MEMBERS_TOKEN is not configured"
            exit 0
          fi
          nix develop --accept-flake-config -c scripts/check-github-members

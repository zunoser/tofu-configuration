name: Create repository configuration

on:
  workflow_dispatch:
    inputs:
      name:
        description: Repository name
        required: true
        type: string
      description:
        description: Repository description
        required: true
        type: string
      visibility:
        description: Repository visibility
        required: true
        default: private
        type: choice
        options:
          - private
          - public
          - internal

concurrency:
  group: new-repository-${{ inputs.name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Generate repository configuration
        env:
          REPOSITORY_DESCRIPTION: ${{ inputs.description }}
          REPOSITORY_NAME: ${{ inputs.name }}
          REPOSITORY_VISIBILITY: ${{ inputs.visibility }}
        run: nix develop --accept-flake-config -c scripts/new-github-repository "$REPOSITORY_NAME" "$REPOSITORY_DESCRIPTION" "$REPOSITORY_VISIBILITY"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_NAME: ${{ inputs.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="create-repository/$REPOSITORY_NAME-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "terraform/resources/github/repos/$REPOSITORY_NAME"
          git commit -m "feat: add $REPOSITORY_NAME repository configuration"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "feat: add $REPOSITORY_NAME repository configuration" \
            --body "Generated by the Create repository configuration workflow."

name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - terraform/resources/github/**
      - terraform/modules/github-repository/**

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - id: changes
        name: Detect changed OpenTofu stacks
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TF_APPLY_ENABLED: ${{ vars.TF_APPLY_ENABLED }}
        run: |
          nix develop --accept-flake-config -c bash -s <<'EOF'
          set -euo pipefail
          stacks=$(scripts/changed-stacks "$BASE_SHA" "$HEAD_SHA")
          echo "stacks=$stacks" >>"$GITHUB_OUTPUT"
          {
            echo '### OpenTofu stacks'
            echo
            echo "$stacks" | jq -r 'if length == 0 then "No changed stacks." else .[] | "- `\(.stack)`" end'
            if [[ "$TF_APPLY_ENABLED" != true ]]; then
              echo
              echo '> Apply is disabled until the apply App, R2 credentials, terraform-apply Environment, and state recovery are configured.'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          EOF

  apply:
    if: needs.detect.outputs.stacks != '[]' && vars.TF_APPLY_ENABLED == 'true'
    needs: detect
    name: apply (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: terraform-apply
    permissions:
      contents: read
    concurrency:
      group: terraform-apply-${{ matrix.stack }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Prevent stale apply
        env:
          STACK: ${{ matrix.stack }}
          TRIGGER_SHA: ${{ github.sha }}
        run: nix develop --accept-flake-config -c scripts/check-stack-current "$TRIGGER_SHA" "$STACK"

      - name: Verify repository scope
        if: matrix.kind == 'repository'
        env:
          EXPECTED_REPOSITORY: ${{ matrix.repository }}
          STACK: ${{ matrix.stack }}
        run: |
          nix develop --accept-flake-config -c bash -s <<'EOF'
          set -euo pipefail
          actual=$(scripts/target-repository "$STACK")
          [[ "$actual" == "$EXPECTED_REPOSITORY" ]]
          EOF

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_TF_APPLY_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_TF_APPLY_PRIVATE_KEY }}
          owner: zunoser
          repositories: ${{ matrix.repository }}
          permission-administration: ${{ matrix.kind == 'repository' && 'write' || '' }}
          permission-environments: ${{ matrix.kind == 'repository' && 'write' || '' }}
          permission-members: ${{ matrix.kind == 'organization' && 'write' || '' }}
          permission-vulnerability-alerts: ${{ matrix.kind == 'repository' && 'write' || '' }}

      - name: Check live Organization members
        if: matrix.kind == 'organization'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: nix develop --accept-flake-config -c scripts/check-github-members

      - name: Plan, enforce policy, and apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APPLY_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APPLY_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          STACK: ${{ matrix.stack }}
          TF_IN_AUTOMATION: 'true'
        run: |
          nix develop --accept-flake-config -c bash -s <<'EOF'
          set -euo pipefail
          plan_file="$RUNNER_TEMP/plan.tfplan"
          plan_json="$RUNNER_TEMP/plan.json"

          tofu -chdir="$STACK" init -reconfigure -lockfile=readonly
          tofu -chdir="$STACK" plan -input=false -out="$plan_file"
          tofu -chdir="$STACK" show -json "$plan_file" >"$plan_json"
          conftest test --policy policy/terraform "$plan_json"
          tofu -chdir="$STACK" apply -input=false "$plan_file"
          EOF
